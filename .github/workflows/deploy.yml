# Builds Vite → dist/, then pushes dist to branch `gh-pages`.
#
# In repo Settings → Pages → Build and deployment:
#   Source: Deploy from a branch
#   Branch: gh-pages  /  /(root)
#
# (Do NOT use "main" / (root) — that only serves unbuilt index.html with /src/main.tsx → blank site.)

name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify static bundle (not dev index.html)
        run: |
          grep -q '/assets/' dist/index.html || { echo "dist/index.html must reference /assets/* from vite build"; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still points at /src/main.tsx"
            exit 1
          fi
      - name: Push dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
